openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A small pet store used to test Mofu APIForge.
servers:
  - url: http://localhost:4010
tags:
  - name: pets
  - name: store
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      parameters:
        - name: limit
          in: query
          description: How many pets to return (1-100).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: A list of pets.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Pet" } }
        "400":
          description: Invalid query.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createPet
      tags: [pets]
      summary: Add a pet
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400":
          description: Invalid body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getPet
      tags: [pets]
      summary: Get one pet
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: No pet with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Remove a pet
      security:
        - apiKey: []
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing or wrong API key.
        "404":
          description: No pet with that id.
  /store/inventory:
    get:
      operationId: getInventory
      tags: [store]
      summary: Count pets by status
      responses:
        "200":
          description: Counts by status.
          content:
            application/json:
              schema:
                type: object
                required: [available, pending, sold]
                properties:
                  available: { type: integer }
                  pending: { type: integer }
                  sold: { type: integer }
  /store/orders:
    post:
      operationId: placeOrder
      tags: [store]
      summary: Order a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Status:
      type: string
      enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, example: Rex }
        tag: { type: string, example: dog }
        status: { $ref: "#/components/schemas/Status" }
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id: { type: integer, example: 1 }
    Order:
      type: object
      required: [petId, quantity]
      properties:
        id: { type: integer, readOnly: true }
        petId: { type: integer }
        quantity: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
